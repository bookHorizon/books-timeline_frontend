name: Build Image & Deploy to Docker

on:
  push:
    branches:
      - main

env:
  CONTAINER: "book-horizon-frontend-prd"
  IMAGE_TAG: "new-for-vultr-k8s-prd"
  IMAGE_NAME: "pingshian0131/books-timeline-frontend_vue"
  PORT: "3001"

jobs:
  build-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: build image
        run: |
          docker build --build-arg NGINX_PORT=${{ env.PORT }} \
          -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .
      - name: login to dockerhub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: push image
        run: docker push ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-image

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up SSH for deployment
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > key.pem
          chmod 600 key.pem
      - name: Deploy to environment
        run: |
          ssh -o StrictHostKeyChecking=no -i key.pem -tt ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} '
            docker stop -t 0 ${{ env.CONTAINER }} &&
            docker rmi ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} &&
            docker run --rm -d --name ${{ env.CONTAINER }} \
            -p "${{ env.PORT }}:${{ env.PORT }}" \
            --network book-horizon \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}'